<!DOCTYPE html>
<html style="background:#1a1423">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Spice Wizard</title>
    <base href="./" />
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="SpiceWizard.Web.styles.css" rel="stylesheet" />
    <style>
        /* The splash that shows while the runtime downloads: the game's own palette, and a row of embers. */
        #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                   background: #1a1423; color: #e6d8bd; font-family: 'Courier New', Courier, monospace; text-align: center; }
        #loading .title { color: #f2c94c; font-size: 2.4em; font-weight: bold; letter-spacing: 0.25em; margin-bottom: 0.4em;
                          text-shadow: 3px 3px 0 #1a1423, 4px 4px 0 #5a3d8a; }
        #loading .sub { color: #b8b4ae; font-size: 0.95em; letter-spacing: 0.08em; }
        #loading .embers { display: flex; gap: 10px; margin: 1.4em 0 1.2em; }
        #loading .embers span { width: 10px; height: 10px; background: #e8762b; box-shadow: 0 0 0 2px #1a1423, 0 0 0 4px #8f2b1e;
                                animation: ember 1.2s infinite; }
        #loading .embers span:nth-child(2) { animation-delay: 0.2s; }
        #loading .embers span:nth-child(3) { animation-delay: 0.4s; }
        #loading .embers span:nth-child(4) { animation-delay: 0.6s; }
        #loading .embers span:nth-child(5) { animation-delay: 0.8s; }
        @keyframes ember { 0%, 100% { background: #8f2b1e; transform: translateY(0); } 40% { background: #fceaa0; } 50% { background: #f2c94c; transform: translateY(-6px); } }
        #loading .credit { color: #6e6a73; font-size: 0.75em; margin-top: 2.5em; }
        #loading .credit a { color: #9b7bd1; text-decoration: none; }
        #loading .credit img { height: 14px; vertical-align: middle; opacity: 0.7; }
    </style>
</head>

<body>

    <div id="app">
        <div id="loading">
            <div class="title">SPICE WIZARD</div>
            <div class="sub">stoking the cauldron&hellip;</div>
            <div class="embers"><span></span><span></span><span></span><span></span><span></span></div>
            <div class="sub">grow peppers &middot; brew sauces &middot; feed the town</div>
            <div class="credit">made with <a href="https://github.com/kniEngine/kni"><img src="kni.png" alt="KNI"></a> KNI</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">x</a>
    </div>

    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script type="module">
        import { BrotliDecode } from './js/decode.min.js';
        window.BrotliDecode = BrotliDecode;
        // Set this to enable Brotli (.br) decompression on static webServers
        // that don't support content compression and http://.
        var enableBrotliDecompression = false;
        Blazor.start({
            loadBootResource: function (type, name, defaultUri, integrity)
            {
                if (enableBrotliDecompression === true && type !== 'dotnetjs' && location.hostname !== 'localhost')
                {
                    return (async function()
                    {
                        const response = await fetch(defaultUri + '.br', { cache: 'no-cache' });
                        if (!response.ok)
                            throw new Error(response.statusText);
                        const originalResponseBuffer = await response.arrayBuffer();
                        const originalResponseArray = new Int8Array(originalResponseBuffer);
                        const contentType = (type === 'dotnetwasm')
                                          ? 'application/wasm'
                                          : 'application/octet-stream';
                        const decompressedResponseArray = BrotliDecode(originalResponseArray);
                        return new Response(decompressedResponseArray,
                                            { headers: { 'content-type': contentType }
                                   });
                    })();
                }
            }
        });
    </script>

    <script src="_content/nkast.Wasm.JSInterop/js/JSObject.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Window.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Document.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Navigator.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Gamepad.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Media.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.XHR/js/XHR.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Canvas/js/Canvas.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Canvas/js/CanvasGLContext.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Audio/js/Audio.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.XR/js/XR.10.0.3.js"></script>

    <script>
        function tickJS()
        {
            window.theInstance.invokeMethod('TickDotNet');
            window.requestAnimationFrame(tickJS);
        }

        window.initRenderJS = (instance) =>
        {
            window.theInstance = instance;

            // set initial canvas size
            var canvas = document.getElementById('theCanvas');
            var holder = document.getElementById('canvasHolder');
            canvas.width = holder.clientWidth;
            canvas.height = holder.clientHeight;
            // disable context menu on right click
            canvas.addEventListener("contextmenu", e => e.preventDefault());
            // Queue clicks so a fast tap is never lost between two game frames.
            window.swClicks = [];
            window.swEscapes = 0;
            canvas.addEventListener("pointerdown", e => {
                if (e.button === 0) window.swClicks.push(Math.floor(e.offsetX), Math.floor(e.offsetY));
            });
            window.addEventListener("keydown", e => { if (e.key === "Escape") window.swEscapes++; });
            // Returns [escapeCount, x0, y0, x1, y1, ...] and clears the queue.
            window.swPollClicks = () => { const c = [window.swEscapes, ...window.swClicks]; window.swClicks = []; window.swEscapes = 0; return c; };

            // Browsers keep an AudioContext suspended until the page is touched: resume every one KNI creates.
            window.swAudioContexts = [];
            var nkCreate = window.nkAudioContext.Create, nkCreate1 = window.nkAudioContext.Create1;
            var swTrack = function(uid) { try { window.swAudioContexts.push(nkJSObject.GetObject(uid)); } catch (e) {} return uid; };
            window.nkAudioContext.Create = function() { return swTrack(nkCreate.apply(this, arguments)); };
            window.nkAudioContext.Create1 = function() { return swTrack(nkCreate1.apply(this, arguments)); };
            var swResume = function() { window.swAudioContexts.forEach(function(ac) { if (ac.state === "suspended") ac.resume(); }); };
            window.addEventListener("pointerdown", swResume);
            window.addEventListener("keydown", swResume);

            // Tuck the day away whenever the tab is hidden or the page is left, so nothing is lost on a close.
            var swSaveNow = function() { try { window.theInstance.invokeMethod('SaveNow'); } catch (e) {} };
            document.addEventListener("visibilitychange", function() { if (document.visibilityState === "hidden") swSaveNow(); });
            window.addEventListener("pagehide", swSaveNow);
            window.swFullscreen = function() {
                var el = document.documentElement;
                if (document.fullscreenElement) { document.exitFullscreen(); return; }
                var go = el.requestFullscreen || el.webkitRequestFullscreen;
                if (go) { try { go.call(el); } catch (e) {} }
            };

            // begin game loop
            window.requestAnimationFrame(tickJS);
        };

        window.addEventListener("keydown", function(event)
        {
            // Prevent Arrows Keys and Spacebar scrolling the outer page
            // when running inside an iframe. e.g: itch.io embedding.
            if ([32, 37, 38, 39, 40].indexOf(event.keyCode) > -1)
                event.preventDefault();
        });
        window.addEventListener("wheel", function(event)
        {
            // Prevent Mousewheel scrolling the outer page
            // when running inside an iframe. e.g: itch.io embedding.
            event.preventDefault();
        }, { passive: false });
    </script>
</body>

</html>
